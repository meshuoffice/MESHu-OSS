  <line x1="24" y1="20" x2="40" y2="20" stroke="url(#meshGrad)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="14" y1="46" x2="50" y2="46" stroke="url(#meshGrad)" stroke-width="2" stroke-dasharray="2 2" opacity="0.5" />
  <line x1="24" y1="20" x2="32" y2="46" stroke="url(#meshGrad)" stroke-width="2" opacity="0.6" />
  <line x1="40" y1="20" x2="32" y2="46" stroke="url(#meshGrad)" stroke-width="2" opacity="0.6" />

  <!-- ネットワークノード（点） -->
  <circle cx="14" cy="46" r="3.5" fill="#818cf8" />
  <circle cx="24" cy="20" r="4" fill="#6366f1" />
  <circle cx="32" cy="34" r="3" fill="#a5b4fc" />
