[PHP]
memory_limit = 512M
post_max_size = 30M
upload_max_filesize = 25M
max_execution_time = 120
max_input_vars = 3000

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

default_charset = "UTF-8"

[Date]
date.timezone = "Asia/Tokyo"

[mbstring]
mbstring.language = Japanese

[opcache]
opcache.enable = 0
